<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>함수 선언 방식 3종 - 선언문</title>
</head>
<body>
  <script>
    const test1 = '함수 선언 전 호출'
    const test2 = '함수 선언 후 호출'
     printMsg(test1);

    function ptintMsg(msg){
      document.write(`함수 호출 메시지 : ${msg}<br>`);

    }
    printMsg(test2);
    ptintMsg('불러보자');
  </script>
</body>
