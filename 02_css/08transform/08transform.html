<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드뒤집기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-origin: top center;
      transform-style: preserve-3d;
    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back {
      transform: rotateX(180deg)
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src=https://img.tvreportcdn.de/cms-content/uploads/2026/04/27/31b792d4-a99e-43f8-a2f9-cdf5676c0004.jpg
          alt="신유 앞면"></div>
      <div class="face back"><img src="https://cdn.nc.press/news/photo/202604/613807_828299_5631.jpg" alt="신유 뒷면"></div>
    </div><!-- //.card -->
  </div><!-- //.con -->
</body>

</html>
