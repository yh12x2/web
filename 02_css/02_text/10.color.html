<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color 속성</title>
  <style>
    body {
      background: lightcoral;
    }

    .hax {
      color: #f0f;
    }

    .rgb {
      color: rgb(208, 246, 203, 1);
      color: rgba(208, 246, 179, )
    }


    .hsl {
      color: hsl(338, 64%, 48%);
    }

    .col {
      color: white;
    }

    div {
      width: 100px;
      height: 50px;
      background-color: rgba(208, 246, 203, 0.5);
      /* opacity: 0.5; */
    }
  </style>

</head>

<body>
  <h1>color 속성</h1>
  <ul>
    <li>글자색 지정</li>
    <li>
      <span class="hax">16진수 값(HAX 코드), </span>
      <span class="rgb">RGB 값 , </span>
      <span class="hsl">HSL 값 , </span>
      <span class="col">색상 이름</span>
    </li>
  </ul>
  <div>rgba</div>
</body>

</html>
